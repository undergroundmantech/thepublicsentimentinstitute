name: flight-recorder

# Independent election-night recorder: one complete snapshot per 10-minute UTC slot, committed to an archive branch.
# GitHub runs `schedule` only from the default branch and treats it as best-effort (runs can start late or be dropped);
# every slot record carries its real start time and names any missed slots. See docs/FLIGHT_RECORDER_GITHUB.md.
# Review before merging to main: merging is what turns the schedule on.

# The 10-minute schedule is held back on main until the recorder is authorized and its archive target verified.
# To enable, restore:
#   schedule:
#     - cron: "*/10 * * * *"
# mode=session records one slot every slot_seconds until `until`. A GitHub-hosted job stops at six hours, so each run
# records for at most max_minutes and then dispatches the next run, which resumes the archive where this one stopped.
# The handoff gap (about a minute) is recorded as missed slots.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "slot = one 10-minute snapshot; session = continuous recording until `until`"
        type: choice
        options: [slot, session]
        default: slot
      until:
        description: "session end, ISO UTC (for example 2026-11-04T12:00:00Z)"
        required: false
      slot_seconds:
        description: "session slot length: 30, 60, 120, 300 or 600"
        required: false
        default: "30"
      max_minutes:
        description: "minutes per run before handing off to the next run"
        required: false
        default: "345"
      archive_branch:
        description: "archive branch override (for a verification run)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: flight-recorder
  cancel-in-progress: false

env:
  # A separate repository is recommended (see the doc). Defaults to an orphan branch of this repository.
  ARCHIVE_REPO: ${{ vars.RECORDER_ARCHIVE_REPO || github.repository }}
  ARCHIVE_BRANCH: ${{ inputs.archive_branch || vars.RECORDER_ARCHIVE_BRANCH || 'recorder/archive-2026' }}
  SESSION: ${{ inputs.mode == 'session' }}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'session' && 358 || 9 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
          sparse-checkout: |
            app
            scripts
            data/intelligence
            public/results/2026
            package.json
            tsconfig.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check out the archive
        env:
          TOKEN: ${{ secrets.RECORDER_ARCHIVE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir archive && cd archive
          git init -q
          git config user.name "onpoint-flight-recorder"
          git config user.email "flight-recorder@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${ARCHIVE_REPO}.git"
          if git ls-remote --exit-code --heads origin "$ARCHIVE_BRANCH" >/dev/null; then
            git fetch -q --depth=1 origin "$ARCHIVE_BRANCH"
            git checkout -q -B "$ARCHIVE_BRANCH" FETCH_HEAD
          else
            git checkout -q --orphan "$ARCHIVE_BRANCH"
            # the archive branch must never build or deploy anything
            printf '{"git":{"deploymentEnabled":false},"ignoreCommand":"exit 0"}\n' > vercel.json
            printf '# OnPoint flight-recorder archive\nEvidence only. Written by .github/workflows/flight-recorder.yml.\n' > README.md
          fi

      - name: Record this slot
        id: capture
        if: inputs.mode != 'session'
        working-directory: code
        run: |
          set +e
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/intelligence/ts-resolve.mjs \
            scripts/recorder/gh-recorder.ts capture --store ../archive | tee ../capture.json
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Record the session
        id: session
        if: inputs.mode == 'session'
        working-directory: code
        env:
          UNTIL: ${{ inputs.until }}
          MAX_MINUTES: ${{ inputs.max_minutes || '345' }}
          RECORDER_SLOT_SECONDS: ${{ inputs.slot_seconds || '30' }}
          RECORDER_CONCURRENCY: "8"
        run: |
          set +e
          end=$(date -u -d "$UNTIL" +%s 2>/dev/null || echo 0)
          now=$(date -u +%s)
          # refuse a missing, past, or more-than-two-days-away end, so a typo cannot start a long chain
          if [ "$end" -le "$now" ] || [ "$end" -gt $((now + 172800)) ]; then
            echo "::error::until must be a UTC time within the next 48 hours (got '${UNTIL}')"; echo "exit=64" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$MAX_MINUTES" -gt 345 ] 2>/dev/null; then MAX_MINUTES=345; fi
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/intelligence/ts-resolve.mjs \
            scripts/recorder/gh-recorder.ts session --store ../archive --until "$UNTIL" --max-minutes "$MAX_MINUTES" \
            --git --branch "$ARCHIVE_BRANCH" | tee ../session.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "ran=$(( $(date -u +%s) - now ))" >> "$GITHUB_OUTPUT"

      - name: Hand off to the next run
        if: always() && inputs.mode == 'session' && steps.session.outputs.exit != '64'
        env:
          GH_TOKEN: ${{ github.token }}
          UNTIL: ${{ inputs.until }}
          RAN: ${{ steps.session.outputs.ran || '0' }}
        run: |
          set -euo pipefail
          left=$(( $(date -u -d "$UNTIL" +%s) - $(date -u +%s) ))
          if [ "$left" -le 90 ]; then echo "session window complete"; exit 0; fi
          # a run that ended early has failed in a way the next run would repeat; stop instead of looping
          if [ "$RAN" -lt 1800 ]; then echo "::error::session ended after ${RAN}s with ${left}s left; not handing off"; exit 1; fi
          gh workflow run flight-recorder.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f mode=session -f until="$UNTIL" -f slot_seconds="${{ inputs.slot_seconds || '30' }}" \
            -f max_minutes="${{ inputs.max_minutes || '345' }}" -f archive_branch="${{ inputs.archive_branch }}"
          echo "next run dispatched with ${left}s left"

      - name: Commit and push (retry)
        if: always()
        working-directory: archive
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          slot=$(node -e 'try{console.log(require("../capture.json").slot)}catch{console.log("unknown")}')
          git commit -q -m "slot ${slot} run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:${ARCHIVE_BRANCH}"; then echo "pushed"; exit 0; fi
            sleep $((i * 5))
            git fetch -q --depth=5 origin "$ARCHIVE_BRANCH" && git rebase -q FETCH_HEAD || git rebase --abort || true
          done
          echo "::error::archive push failed after 5 attempts"
          exit 1

      - name: Fail the job when the slot failed
        if: inputs.mode != 'session' && steps.capture.outputs.exit != '0'
        run: |
          echo "::error::flight recorder slot did not record (exit ${{ steps.capture.outputs.exit }})"
          exit 1

      - name: Fail the job when the session failed
        if: always() && inputs.mode == 'session' && steps.session.outputs.exit != '0'
        run: |
          echo "::error::flight recorder session ended with exit ${{ steps.session.outputs.exit }}"
          exit 1
