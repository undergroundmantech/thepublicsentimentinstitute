name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Forecast and expected results agree
        run: node --test scripts/test-forecast-results-consistency.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
