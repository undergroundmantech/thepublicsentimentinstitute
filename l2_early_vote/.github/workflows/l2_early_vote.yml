name: L2 early vote pull
on:
  schedule:
    - cron: "17 13,21 * * *"   # about 9:17 AM and 5:17 PM Eastern
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python l2_early_scraper.py
      - run: |
          git config user.name "early-vote-bot"
          git config user.email "early-vote-bot@users.noreply.github.com"
          git add data
          git commit -m "L2 early vote snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push
