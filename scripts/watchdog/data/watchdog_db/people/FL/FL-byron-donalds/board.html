@media (prefers-reduced-motion:reduce){ .dim,.lit{transition:none} }

 {id:"kohelet",label:"Kohelet Policy Forum",bloc:"israel",ring:3,amt:0,note:"Jerusalem think tank founded Jan 2012 by Moshe Koppel. Its papers underpinned the 2023 judicial overhaul submitted by Justice Minister Yariv Levin and MK Simcha Rothman. Took 25M shekels in 2021 and 29M in 2022, cut about half its staff April 2024. Haaretz in March 2021 named both Yass and Dantchik as principal funders. The New York Times, Washington Post and Calcalist reported in 2023 that Yass never donated and Dantchik was the dominant funder. No filing shows a Yass grant to any Kohelet vehicle.",flag:"Yass link CONTESTED. Defensible line: Donalds' second largest donor is the business partner of the man who bankrolled Kohelet"},

 // gambling
 {id:"compact",label:"2021 Seminole compact",bloc:"gamble",ring:4,lever:true,amt:903000000,note:"Executed April 23, 2021, runs to July 31, 2051. Exclusivity over slots, craps, roulette, banked cards, fantasy and statewide mobile sports betting via servers on tribal land. State share 13.75 percent of sports net win, $2.5B guaranteed over the first five years. Payments: $357M FY23-24, $817.3M FY24-25, forecast $903M FY25-26 and past $1B by FY28-29. The only reopener, a 36 month iGaming window, lapsed around Sept 2024. The governor executes compacts and the Legislature ratifies. The 2015 to 2019 precedent shows the Tribe withholds payments when exclusivity is breached.",flag:"Governor decides whether exclusivity is enforced against prediction markets"},
 {id:"fgcc",label:"Florida Gaming Control Commission",bloc:"gamble",ring:4,lever:true,amt:0,note:"Five members, all appointed by the governor and Senate confirmed to four year terms under s. 16.71. Enforcement posture on prediction markets, pick6 style products and iGaming runs through this body. HB 189 and HB 591, which would have made non compact online wagering a felony, failed in 2026."},
 {id:"hardrock",label:"Hard Rock Bet",bloc:"gamble",ring:3,amt:0,note:"The Seminole Tribe's monopoly mobile sportsbook. Jim Allen said in 2024 Hard Rock never ruled out partnering with Caesars, BetMGM, DraftKings or FanDuel and wants to reopen the compact for online casino. Ballard Partners dropped DraftKings and FanDuel in 2021 and represents Hard Rock."},
 {id:"dksuit",label:"Seminole v. DraftKings, Oct 8 2026",bloc:"gamble",ring:3,amt:0,note:"72 page Broward Circuit Court suit against DraftKings, CEO Jason Robins and GUS III LLC over DraftKings Predictions and Pick6: injunction, disgorgement and a RICO count. The only Florida enforcement against a prediction market product so far. The state has taken no action against Kalshi, Robinhood or Polymarket. AG Uthmeier was one of six AGs who did not sign the anti Kalshi coalition letter.",flag:"Donalds has no recorded reaction"},
 {id:"scotus",label:"Prediction markets at the Supreme Court",bloc:"gamble",ring:4,lever:true,amt:0,note:"Circuit split, Third versus Sixth and Ninth, on whether CFTC jurisdiction preempts state gambling law. New Jersey cert petition No. 26-299 filed with 39 AGs and 130 tribes as amici Oct 7 to 8, 2026. CFTC issued odds display guidance Aug 7, 2026. A governor and AG decide whether Florida joins the states fighting Kalshi."},
 {id:"semgive",label:"Seminole 2026 giving elsewhere",bloc:"gamble",ring:3,amt:3300000,note:"Beyond Donalds: Wilton Simpson $1M, Jason Brodeur and Boyd $750K, RPOF $750K, Florida Democratic Party $200K, Uthmeier $50K, Crist $50K, Jolly $0. $8.79M total per Transparency USA as of Oct 2, 2026."},
 // detention
 {id:"depot",label:"Deportation Depot, Baker CI",bloc:"detain",ring:4,lever:true,amt:101000000,note:"Still operating with about 1,000 detainees as of Oct 15, 2026, run by GEO|CDR BAKER, a venture formed late Aug 2025 whose officers include Carlos Duart, Vidal-Duart, George Zoley and GEO CEO Donahue. Contract cap $101M, $32M paid by Sept 22, 2026. Alligator Alcatraz closed June 25, 2026 and was dismantled by July 15 after costs ran toward $1B. The next governor decides whether the Depot stays open, under what contract, and whether FDEM keeps running detention under a DeSantis emergency order extended more than 20 times."},
 {id:"owed",label:"$417M in unpaid vendor invoices",bloc:"detain",ring:4,lever:true,amt:417000000,note:"June 30, 2026 FDEM report: more than $417M across 592 immigration invoices. Florida Phoenix June 17: at least $603M owed to 27 of 38 contractors, including Doodie Calls $122M owed, IRG about $112M, GEO CDR Baker about $100M, GardaWorld $78M. Legislative Budget Commission moved $240M on Sept 11, 2026, about $187M for immigration invoices, leaving roughly $230M unfunded entering the next term. FY2026-27 immigration projection $500M, worst case a $1.5B fund deficit.",flag:"Vendors owed money gave $3.3M plus to Donalds and nothing to Jolly"},
 {id:"fema",label:"FEMA $608M reimbursement",bloc:"detain",ring:3,amt:608000000,note:"Award effective Sept 30, 2025. First request denied Dec 10, 2025 over environmental review; $58M paid late May 2026; $84.5M received by mid Sept 2026. Florida says the federal government still owes $523M. The grant cannot cover construction."},
 {id:"sbie",label:"State Board of Immigration Enforcement",bloc:"detain",ring:4,lever:true,amt:250000000,note:"Created by SB 2-C, Feb 13, 2025: Governor and Cabinet acting unanimously, a $250M local grant program, a council that recommends detention bed strategy, and authority to suspend noncompliant local officials. Donalds said in Aug 2026 he will remove local officials and state attorneys over sanctuary policies, and in Jacksonville Oct 13: states don't set immigration policy, the federal government does."},
 {id:"uthmeier",label:"AG James Uthmeier",bloc:"detain",ring:3,amt:375000,note:"The second office the big blocs need. Shared donors with Donalds: CDR $275K including $250K on Sept 17, 2025 two weeks after the $100M Depot contract; GEO $50K; Seminole $50K; Kalshi $50K; Garner, Williams and AT&T gifts around contract awards. Club for Growth endorsed him. He sells Alligator Alcatraz merchandise and alligatoralcatraz.com redirects to his store.",flag:"Three of the top four blocs depend on both the governor and the AG"},
 {id:"geofed",label:"GEO federal expansion",bloc:"detain",ring:3,amt:3000000000,note:"2025 revenue $2.6B, FY2026 guidance $2.95B to $3.05B, ICE 48 percent of revenue. New ICE contracts at Hudson CO and Winton NC. GEO Reentry gave MAGA Inc. $1M on July 16, 2026 and $413K on July 31 within days of those awards. Zoley led $5M plus to Trump world since 2024. Acting ICE director Venturella is ex GEO; Tom Homan reported as a paid GEO consultant. Florida: Broward Transitional Center renewal, Graceville and Bay prisons transition to GEO July 1, 2027 at about $100M a year. GEO has collected $320M plus on South Bay since 2009."},
 {id:"vendorgive",label:"Vendor giving to DeSantis and RPOF",bloc:"detain",ring:3,amt:2300000,note:"CDR and Duart about $1.9M historical to DeSantis and RPOF plus $500K to a DeSantis committee and $70K to Miami-Dade Commissioner Gilbert. ARS and IRG, Canadian owned by the Gagliano family with about $200M in prior no bid state work and Hurricane Ian fraud countersuits: $99,980 to Friends of Ron DeSantis Nov 3, 2022, $99,980 to RPOF, $75K to Moody, $10K to RPOF the day after a $51M contract, $100K to RPOF Oct 2025. Longview Solutions, $25.6M, is owned by Roy Dunn, ex FDEM and ex CDR Maguire. Ballard Partners lobbies for IRG."},
 // utilities and data centers
 {id:"psc",label:"Public Service Commission",bloc:"energy",ring:4,lever:true,amt:7000000000,note:"Approved FPL's roughly $7B settlement unanimously Nov 20, 2025; challenge pending at the Florida Supreme Court. Governor appoints commissioners from a legislative nominating council; DeSantis reappointed Gary Clark and Gabriella Passidomo-Smith in 2026. Duke's settlement runs through 2027, so Duke's next rate case lands on the next governor's PSC. PSC approved $1.55B in TECO and Duke storm cost recovery. SB 126 adds affordability as a rate criterion rather than capping return on equity. Donalds opposes an ROE cap; Jolly wants a profit cap.",flag:"NextEra forecasts 8 GW of data center load by 2032"},
 {id:"tango",label:"Project Tango and SB 484",bloc:"energy",ring:4,lever:true,amt:0,note:"Project Tango, about 37M square feet near Loxahatchee: zoning board denial July 2 to 3, 2026, county moratorium July 7, commissioners rejected it July 16, though prior data center entitlement on the site survived. Seeking Rents counts $20M to $30M in data center money in Florida campaigns. SB 484 on data centers was signed May 7, 2026 after being watered down following White House contact with House members; HB 7031 in 2025 ended the sales tax exemption below 100 MW. Donalds opposes a statewide moratorium; Jolly says a ban should be on the table."},
 {id:"sb482",label:"SB 482 AI Bill of Rights",bloc:"ai",ring:4,lever:true,amt:0,note:"Passed the Senate 35 to 2 and was killed in Speaker Perez's House after White House contact, then failed again in the April 28 to May 1 special session. Leading the Future's stated goal is a national framework, meaning preemption of state AI laws. Donalds moved from 'the future of the state is data centers' in June 2025 to local control plus a federal Protecting Ratepayers Act in July 2026; Anthropic linked Public First spent $1M plus praising him for opposing federal preemption."},
 {id:"ltfother",label:"Leading the Future elsewhere",bloc:"ai",ring:3,amt:140000000,note:"$140M plus network. $800K in the Kansas governor primary, endorsements of unnamed Florida legislative candidates, roughly 1,700 Tampa and Tallahassee spots for Donalds in March and April 2026 that never mentioned AI."},
 // developers and tax
 {id:"amend3",label:"Amendment 3 homestead exemption",bloc:"dev",ring:4,lever:true,amt:12000000000,note:"Raises the homestead exemption to $50K to $150K in 2027 and $250K in 2028. Realtors committed $10M on Sept 9, 2026 and the pro side reached $18M per WPTV, outspending opponents 26 to 1. FPI estimates nearly $12B a year in lost local revenue. Sheriff Grady Judd called it a train wreck Aug 4, 2026; Sarasota's administrator warned of sheriff cuts; Florida Association of Special Districts put $100K into Vote No on 3. Donalds narrowed his fallback plan over a math problem and said fiscally constrained counties should not sing for supper.",flag:"Full homestead elimination goes to the 2027 Tax and Budget Reform Commission"},
 {id:"tbrc",label:"2027 Tax and Budget Reform Commission",bloc:"dev",ring:4,lever:true,amt:0,note:"Convenes in 2027 with gubernatorial and legislative appointees. Donalds has promised full and complete property tax reform through it. Speaker Perez's House authored the Dec 2025 property tax plan."},
 {id:"rural",label:"Rural boundary and sprawl bills",bloc:"dev",ring:4,lever:true,amt:0,note:"Rural boundary bill cleared committee March 2025 and Seminole County sued in Aug 2025; a 2026 law eases paving farmland per Florida Trident July 1, 2026; WGCU Oct 13, 2026 reported a major developer eyeing rural Florida. DEP, DEO and the water management district appointments run through the governor. Hosseini was reappointed UF chair June 9, 2025 amid the presidential search fight."},
 {id:"sb280",label:"Short term rental preemption",bloc:"dev",ring:4,lever:true,amt:0,note:"SB 280 is Airbnb's vehicle to preempt local short term rental rules. 2026 status unconfirmed; the earlier DeSantis veto is recalled but unverified."},
 // insurance
 {id:"citizens",label:"Citizens and tort reform",bloc:"insure",ring:4,lever:true,amt:0,note:"Citizens is down to about 270,000 policies and S&P projects its largest full year underwriting loss. Donalds' Bring Down the Bill plan keeps the 2022 to 2023 tort reforms and shrinks Citizens further; AFP Action's endorsement praised that pledge. PolitiFact on Sept 21, 2026 found his $1,000 hurricane tax attack on Jolly comes with a lot of fine print. Jolly proposes a catastrophe wind fund."},
 // school choice
 {id:"stepup",label:"Step Up for Students and the $4B voucher economy",bloc:"school",ring:4,lever:true,amt:4250000000,note:"Florida choice spending is about $4B to $4.5B a year across 500K plus students, roughly $8K per voucher, 82 percent at religious schools. The Nov 2025 Auditor General report found overspending, double funding and no controls on where students are educated; Step Up froze about 28,000 accounts in Aug 2025; $1M to $2M went to fictitious students. SB 318 fixes passed the Senate unanimously and died in the House. Donalds' plan: funding follows every student, scrap A to F grades, AI and ed tech, private sector participation, no new accountability measures. Yass wants 100 percent of per pupil funding in accounts.",flag:"Erika's firms sell into this program; she says she will keep doing education policy work as first lady"},
 {id:"afpi",label:"AFPI, Moms for Liberty, CLT",bloc:"school",ring:3,amt:0,note:"Erika chairs the America First Policy Institute's Center for Education Opportunity, advises Moms for Liberty and the Classical Learning Test, and launched a Florida Promise Tour Sept 21, 2026. She told Axios Sept 22: I would be doing that whether I'm first lady or not."},
 {id:"snyder",label:"Rep. John Snyder",bloc:"school",ring:3,amt:700000,note:"HD 86, in office since Nov 2020. Owns ESI Technical dba Educator Solutions, paid $6.93M by Optima charters 2020 to 2022 plus $2.78M by the Foundation and $1.76M in 2023. Reports nearly $700K from ESI since 2020. Also sponsor of the HB 1039 bitcoin reserve bill with Gruters, which cleared its first committee 18 to 0 on Feb 11, 2026."},
 // billionaires second hop
 {id:"griffinfl",label:"Griffin's Florida footprint",bloc:"billion",ring:3,amt:28000000,note:"$28M plus in Florida in 2024: $12M against the marijuana amendment, $7M to RPOF, $4M each to House and Senate leadership; Citadel got a carveout in the Chinese property law. 2026: $2.5M in May to Stronger Safer Nation for Moody, $10M SLF, $5M CLF. $3B to Carnegie Mellon Sept 30, 2026 including a Wynwood campus, $75M Baptist Health, $50M UM, a 54 story Brickell HQ. DeSantis pitched Griffin in June 2025 and at Fishers Island on funding Collins; Griffin declined. Oct 21, 2026 he called tariffs a fiasco and urged investment in AI, data centers and nuclear."},
 {id:"cfgslate",label:"Club for Growth Florida slate",bloc:"billion",ring:3,amt:2300000,note:"Endorsed Donalds, Uthmeier for AG, Luna FL-13, Beltran FL-14. CFG Action, funded by Yass $10M Nov 2025 and $15M this cycle plus Uihlein's Restoration of America $17.5M, spent about $705K against Casey Askar in FL-22 and $456K against Kathy Castor; Win It Back PAC $1.1M against Chris Collins in FL-19."},
 {id:"yasstrump",label:"Yass and Trump",bloc:"trump",ring:3,amt:21000000,note:"$16M to MAGA Inc. on Jan 17 and March 6, 2025, a $5M White House ballroom pledge, and a Susquehanna affiliate seat on the TikTok USDS board in Jan 2026. Yass retains about 7 percent of ByteDance and is a Kalshi investor."},
 // Israel second hop
 {id:"claws",label:"Claws Foundation",bloc:"israel",ring:3,amt:31000000,note:"EIN 20-1658710. Funding attributed exclusively to Dantchik per Shomrim; Yass was a director 2015 to 2022 only. Largest Israel grantee is the pluralist Shalom Hartman Institute, $25M plus 2010 to 2020 and $31M per a spokesperson, then Jerusalem Online University $7.9M, Hebrew University, Taub Center. The Guardian's $16M Yass figure is mostly Claws money and therefore weak attribution."},
 {id:"silver",label:"Silver Valley Research Foundation",bloc:"israel",ring:3,amt:12000000,note:"US nonprofit described as medical research. Received about $12M from Claws in 2021 and passed most of it to the Central Fund of Israel, Kohelet's sole 2021 donor. Kohelet got about $7.7M in 2021 and $8.5M in 2022 through CFI."},
 {id:"hartman",label:"Shalom Hartman Institute",bloc:"israel",ring:3,amt:31000000,note:"Pluralist Jerusalem institute and the biggest recipient of Claws Foundation money. Included so the Kohelet chain is read in proportion."},
 {id:"yassisrael",label:"Yass's own Israel-adjacent giving",bloc:"israel",ring:3,amt:5800000,note:"$3M to Hadassah in 2023 via the Susquehanna Foundation. QXZ Inc. grants: $1.5M Citizens for a Nuclear Free Iran, $250K Emergency Committee for Israel in 2015, $1.05M Republican Jewish Coalition 2018 to 2019, which his spokesperson says he did not direct. No link found to Tikvah, Shalem, Im Tirtzu, Regavim or Israeli defense investments."},

 {id:"reservoir",label:"EAA reservoir and discharges",bloc:"sugar",ring:4,lever:true,amt:0,note:"State led build with all contracts finalized April 2026, completion 2029. Florida Crystals publicly commended it April 15, 2026 and makes no explicit asks; its New Hope Sugar got $2.4M in 2019 to end a 1,234 acre lease. Everglades Trust endorsed Donalds the week of Oct 6, 2026 to maintain DeSantis's momentum and keep discharges out of the estuaries. Donalds has no documented statement on sugar."},
 {id:"hb167",label:"HB 167 phosphate liability",bloc:"sugar",ring:4,lever:true,amt:500000,note:"Mosaic wrote HB 167 to replace strict liability with negligence for radiation claims from phosphogypsum. Mosaic gave $500K plus to state candidates in the first nine months of 2025. Final 2026 fate unconfirmed."},

 {id:"winkmaga",label:"Winklevoss to MAGA Inc.",bloc:"crypto",ring:3,amt:10000000,note:"$10M on June 19, 2026, three weeks after the administration moved to vacate a Gemini enforcement action. Part of $32M plus in 2025 to 2026 giving including $21M to their Digital Freedom Fund."},

// ---------- layout ----------
const W=2200,H=1560,CX=1100,CY=780;
const byId={}; N.forEach(n=>byId[n.id]=n);
const blocOrder=["billion","israel","trump","enforce","ai","crypto","insure","sugar","dev","energy","detain","gamble","school"];
const rings={1:170,2:360,3:540,4:720};
const sectors={};
// allocate angular span proportional to count of ring 2 and 3 nodes, with a floor
let weights=blocOrder.map(b=>Math.max(3,N.filter(n=>n.bloc===b&&n.ring>=2).length));
let tot=weights.reduce((a,b)=>a+b,0), a0=-Math.PI/2;
blocOrder.forEach((b,i)=>{const span=2*Math.PI*weights[i]/tot; sectors[b]={a0:a0,a1:a0+span,mid:a0+span/2}; a0+=span;});
function place(){
  byId.donalds.x=CX; byId.donalds.y=CY;
  const veh=["fbd","gov","cong","pcp"], vang={fbd:Math.PI*0.5, gov:Math.PI*1.0, cong:Math.PI*1.5, pcp:0};
  byId.fbd.x=CX; byId.fbd.y=CY+rings[1];
  byId.gov.x=CX-rings[1]*0.85; byId.gov.y=CY-rings[1]*0.3;
  byId.cong.x=CX+rings[1]*0.85; byId.cong.y=CY-rings[1]*0.3;
  byId.pcp.x=CX+rings[1]*0.55; byId.pcp.y=CY-rings[1]*1.05;
  byId.match.x=CX-rings[1]*1.6; byId.match.y=CY-rings[1]*0.9;
  blocOrder.forEach(b=>{
    const s=sectors[b];
    [2,3,4].forEach(r=>{
      const nodes=N.filter(n=>n.bloc===b&&n.ring===r&&n.id!=="amf");
      nodes.forEach((n,i)=>{
        const t=(i+0.5)/nodes.length;
        const ang=s.a0+(s.a1-s.a0)*t;
        const jit=r===2?(i%2?44:-10):r===3?(i%2?48:-24):(i%2?46:-30);
        const rad=rings[r]+jit;
        n.x=CX+Math.cos(ang)*rad*1.12; n.y=CY+Math.sin(ang)*rad*0.96; n.ang=ang;
      });
    });
  });
  // tuck AMF just inside the ai sector
  const amf=byId.amf, s=sectors.ai; amf.x=CX+Math.cos(s.mid)*270*1.12; amf.y=CY+Math.sin(s.mid)*270*0.96;
}
place();

const svg=document.getElementById("svg");
const NS="http://www.w3.org/2000/svg";

[gRings,gEdges,gLab,gNodes].forEach(g=>root.appendChild(g));

const cvar=b=>`var(${BLOCS[b].c})`;

[1,2,3,4].forEach(r=>{const t=el("text",{x:CX+6,y:CY-rings[r]*0.96+14,class:"ringlab"},gRings);t.textContent=ringNames[r];});
blocOrder.forEach(b=>{const s=sectors[b],R=860;const x=CX+Math.cos(s.mid)*R*1.12,y=CY+Math.sin(s.mid)*R*0.96;const t=el("text",{x,y,class:"sector","text-anchor":"middle",style:`--sc:${cvar(b)}`},gLab);t.textContent=BLOCS[b].name;});
const fmt=v=>v>=1e9?"$"+(v/1e9).toFixed(v%1e9?1:0)+"B":v>=1e6?"$"+(v/1e6).toFixed(v%1e6?1:0)+"M":v>=1e3?"$"+Math.round(v/1e3)+"K":v>0?"$"+v:"";
const rad=n=>n.hub?34:n.lever?15:n.ring===1?22:Math.max(7,Math.min(30,4+Math.sqrt((n.amt||0)/1e6)*7));
const edgeEls=[],nodeEls={};
E.forEach(e=>{
  const a=byId[e.s],b=byId[e.t]; if(!a||!b){return;}
  const w=e.kind==="link"?1.2:Math.max(1,Math.min(9,0.8+Math.sqrt(e.amt/1e6)*2.2));
  const mx=(a.x+b.x)/2+(a.y-b.y)*0.12, my=(a.y+b.y)/2+(b.x-a.x)*0.12;
  const p=el("path",{d:`M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}`,class:"edge"+(e.kind==="contested"?" contested":e.kind==="flow"?" flow":""),"stroke-width":w,style:`--ec:color-mix(in srgb,${cvar(a.bloc==="vehicle"?b.bloc:a.bloc)} 55%,var(--edge))`},gEdges);
  p.dataset.s=e.s;p.dataset.t=e.t; edgeEls.push({e,p});
});
N.forEach(n=>{
  const g=el("g",{class:"node"+(n.hub?" hub":""),transform:`translate(${n.x},${n.y})`,tabindex:0,role:"button","aria-label":n.label},gNodes);
  const r=rad(n);
  if(n.lever){el("rect",{x:-r,y:-r,width:r*2,height:r*2,rx:3,transform:"rotate(45)",fill:"var(--panel)",stroke:cvar(n.bloc),"stroke-width":3,class:"leverbox"},g);}
  else el("circle",{r,fill:n.hub?"var(--hub)":cvar(n.bloc)},g);
  if(n.flag&&!n.hub){el("circle",{r:r+7,fill:"none",stroke:"var(--c-enforce)","stroke-width":1.5,"stroke-dasharray":"3 3"},g);}
  const t=el("text",{y:r+13,"text-anchor":"middle","font-size":n.ring<=1?13:11},g); t.textContent=n.label;
  if(n.amt&&!n.hub){const a=el("text",{y:r+25,"text-anchor":"middle",class:"amt"},g);a.textContent=fmt(n.amt);}
  g.addEventListener("click",ev=>{ev.stopPropagation();select(n.id);});
  g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(n.id);}});
  g.addEventListener("mousemove",ev=>showTip(n,ev)); g.addEventListener("mouseleave",hideTip);
  nodeEls[n.id]=g;
});

const tip=document.getElementById("tip");
function showTip(n,ev){const rect=document.getElementById("canvas").getBoundingClientRect();tip.style.display="block";tip.innerHTML=`<b>${n.label}</b><span class="m">${n.amt?fmt(n.amt):""} · ${BLOCS[n.bloc].name}</span>`;tip.style.left=(ev.clientX-rect.left+14)+"px";tip.style.top=(ev.clientY-rect.top+14)+"px";}
function hideTip(){tip.style.display="none";}
let selected=null, activeBlocs=new Set(Object.keys(BLOCS));
function neighbors(id){const s=new Set([id]);E.forEach(e=>{if(e.s===id)s.add(e.t);if(e.t===id)s.add(e.s);});return s;}
function applyVis(){
  const nb=selected?neighbors(selected):null;
  N.forEach(n=>{
    const g=nodeEls[n.id];const inBloc=activeBlocs.has(n.bloc)||n.hub||n.bloc==="vehicle";
    const lit=inBloc&&(!nb||nb.has(n.id));
    g.classList.toggle("dim",!lit);g.classList.toggle("lit",lit);
  });
  edgeEls.forEach(({e,p})=>{
    const a=byId[e.s],b=byId[e.t];
    const inBloc=(activeBlocs.has(a.bloc)||a.bloc==="vehicle")&&(activeBlocs.has(b.bloc)||b.bloc==="vehicle");
    const lit=inBloc&&(!selected||e.s===selected||e.t===selected);
    p.classList.toggle("dim",!lit);
  });
}
const panel=document.getElementById("panel");
function select(id){
  selected=id;applyVis();const n=byId[id];
  const ins=E.filter(e=>e.t===id),outs=E.filter(e=>e.s===id);
  const row=(e,other)=>`<button data-go="${other}">${byId[other].label}<span>${e.label}</span></button>`;
  panel.innerHTML=`<div class="eyebrow" style="--sc:${cvar(n.bloc)}">${BLOCS[n.bloc].name}</div><h2>${n.label}</h2>${n.amt?`<div class="big">${fmt(n.amt)}</div>`:""}<p>${n.note}</p>${n.flag?`<span class="flag">${n.flag}</span>`:""}<div class="links">${ins.length?`<h3>Money or ties in</h3>`+ins.map(e=>row(e,e.s)).join(""):""}${outs.length?`<h3>Money or ties out</h3>`+outs.map(e=>row(e,e.t)).join(""):""}</div><p class="note" style="margin-top:14px"><button data-clear style="background:none;border:1px solid var(--line);color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer;font:600 .74rem var(--font-body)">Clear selection</button></p>`;
  panel.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.go)));
  panel.querySelector("[data-clear]").addEventListener("click",()=>{selected=null;applyVis();home();});
}

// chips
const chips=document.getElementById("chips");
Object.keys(BLOCS).filter(b=>b!=="vehicle").forEach(b=>{const c=document.createElement("button");c.className="chip on";c.style.setProperty("--c",cvar(b));c.innerHTML=`<i></i>${BLOCS[b].name}`;c.setAttribute("aria-pressed","true");c.addEventListener("click",()=>{const allOn=[...chips.querySelectorAll(".chip")].every(x=>x.classList.contains("on"));if(allOn){activeBlocs=new Set(["vehicle",b]);}else if(activeBlocs.has(b)){activeBlocs.delete(b);if(activeBlocs.size<=1)activeBlocs=new Set(Object.keys(BLOCS));}else activeBlocs.add(b);chips.querySelectorAll(".chip").forEach(x=>{const on=activeBlocs.has(x.dataset.b);x.classList.toggle("on",on);x.setAttribute("aria-pressed",on);});applyVis();});c.dataset.b=b;chips.appendChild(c);});

// pan and zoom
let vb={x:0,y:0,w:W,h:H},drag=null;
function setVB(){svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);}
function zoom(f,cx,cy){const nw=Math.max(400,Math.min(W*2.5,vb.w*f));const nh=nw*H/W;const px=cx===undefined?vb.x+vb.w/2:cx,py=cy===undefined?vb.y+vb.h/2:cy;vb.x=px-(px-vb.x)*(nw/vb.w);vb.y=py-(py-vb.y)*(nh/vb.h);vb.w=nw;vb.h=nh;setVB();}
function pt(ev){const r=svg.getBoundingClientRect();return{x:vb.x+(ev.clientX-r.left)/r.width*vb.w,y:vb.y+(ev.clientY-r.top)/r.height*vb.h};}
svg.addEventListener("wheel",ev=>{ev.preventDefault();const p=pt(ev);zoom(ev.deltaY>0?1.12:0.89,p.x,p.y);},{passive:false});
svg.addEventListener("pointerdown",ev=>{drag={x:ev.clientX,y:ev.clientY,vx:vb.x,vy:vb.y};svg.classList.add("dragging");svg.setPointerCapture(ev.pointerId);});
svg.addEventListener("pointermove",ev=>{if(!drag)return;const r=svg.getBoundingClientRect();vb.x=drag.vx-(ev.clientX-drag.x)/r.width*vb.w;vb.y=drag.vy-(ev.clientY-drag.y)/r.height*vb.h;setVB();});
svg.addEventListener("pointerup",()=>{drag=null;svg.classList.remove("dragging");});
document.getElementById("zin").onclick=()=>zoom(0.8);document.getElementById("zout").onclick=()=>zoom(1.25);document.getElementById("zreset").onclick=()=>{vb={x:0,y:0,w:W,h:H};setVB();};
// phone: start zoomed to center
if(window.innerWidth<820){vb={x:CX-600,y:CY-480,w:1200,h:1200*H/W};setVB();}
