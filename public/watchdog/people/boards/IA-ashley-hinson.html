.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.35}
.main{display:grid;grid-template-columns:1fr 380px;min-height:0}
.canvas{position:relative;overflow:hidden;cursor:grab}
svg{width:100%;height:100%;display:block}
.edge{fill:none;stroke-linecap:round}
.node circle{stroke:var(--bg);stroke-width:2;cursor:pointer}
.node text{font:600 10px var(--font-body);fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.dim{opacity:.08}
.ringlab{font:600 10px var(--font-mono);fill:var(--faint);letter-spacing:.14em}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px}
aside h2{font:900 1.2rem var(--font-display);margin:2px 0}
.big{font:600 1.35rem var(--font-mono);color:var(--hub)}
.muted{color:var(--muted);font-size:.88rem}
.row{background:var(--panel2);border-radius:4px;padding:7px 9px;margin:6px 0;font-size:.86rem}
.row b{font-family:var(--font-mono);font-weight:600}
.row a{color:var(--hub)}
.tag{display:inline-block;font:600 .66rem var(--font-mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);margin-right:4px}
.tag.Contested,.tag.Provisional{color:var(--warn);border-color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.tablewrap{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:12px;display:none}
.tablewrap.on{display:block}
.tablewrap a{color:var(--hub)}
@media (max-width:820px){.main{grid-template-columns:1fr;grid-template-rows:1fr auto}aside{border-left:0;border-top:1px solid var(--line);max-height:42vh}.tools{margin-left:0}}
