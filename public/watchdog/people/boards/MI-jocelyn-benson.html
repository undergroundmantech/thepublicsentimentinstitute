D.nodes.forEach(n=>{const gg=el("g",{class:"node",tabindex:0,role:"button","aria-label":n.label},gn);el("circle",{cx:n.x,cy:n.y,r:rad(n),fill:nc(n)},gg);
 const t=el("text",{x:n.x,y:n.y+rad(n)+12,"text-anchor":"middle"},gg);t.textContent=n.label.length>28?n.label.slice(0,26)+"…":n.label;
 gg.addEventListener("click",ev=>{ev.stopPropagation();select(n.id)});gg.addEventListener("keydown",ev=>{if(ev.key==="Enter")select(n.id)});nodeEls[n.id]=gg;});
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rowHtml(e){const other=e.s===cur?byId[e.t]:byId[e.s];const dir=e.s===cur?"to":"from";
 return `<div class="row"><b>${esc(e.amount||"tie")}</b> ${dir} ${esc(other?other.label:"")}<br><span class="muted">${esc(e.date)} · ${esc(e.type)} · hop ${esc(e.hop)}</span> <span class="tag ${esc(e.status)}">${esc(e.status)}</span><br>${esc(e.note)}${e.src?` <a href="${esc(e.src)}" target="_blank" rel="noopener">source</a>`:""}</div>`}
let cur=null;
function select(id){cur=id;const n=byId[id];const es=D.edges.filter(e=>e.s===id||e.t===id);const nb=new Set([id]);es.forEach(e=>{nb.add(e.s);nb.add(e.t)});
 for(const k in nodeEls)nodeEls[k].classList.toggle("dim",!nb.has(k));edgeEls.forEach(({e,p})=>p.classList.toggle("dim",!(e.s===id||e.t===id)));
 const P=document.getElementById("panel");
 P.innerHTML=`<div class="muted">${esc(n.ring===0?"Subject":n.ring===1?"Money vehicle":n.ring===4?"Decision on the desk":n.bloc)}</div><h2>${esc(n.label)}</h2>${n.amt?`<div class="big">${fmt(n.amt)}</div><div class="muted">largest documented figure touching this node, cumulative where labeled</div>`:""}${n.note?`<p>${esc(n.note)}</p>`:""}${es.map(rowHtml).join("")}`;}
function reset(){cur=null;for(const k in nodeEls)nodeEls[k].classList.remove("dim");edgeEls.forEach(({p})=>p.classList.remove("dim"));applyFilter();
 document.getElementById("panel").innerHTML=`<h2>${esc(D.name)}</h2><p class="muted">${esc(D.blurb)}</p>${D.bluf.map(b=>`<div class="row">${esc(b)}</div>`).join("")}<p class="muted">${D.edges.length} edges, ${D.nodes.length} entities. Dashed lines are contested or provisional. Dotted grey lines are relationships without money. Click any node for its rows and sources.</p>`;}
function applyFilter(){D.nodes.forEach(n=>{if(n.ring>=2&&n.ring<4&&n.bloc)nodeEls[n.id].style.display=on.has(n.bloc)?"":"none"});edgeEls.forEach(({e,p})=>{const a=byId[e.s],b=byId[e.t];const hid=[a,b].some(x=>x&&x.ring>=2&&x.ring<4&&x.bloc&&!on.has(x.bloc));p.style.display=hid?"none":""});}
const chips=document.getElementById("chips");
blocs.forEach(b=>{const c=document.createElement("button");c.className="chip";c.setAttribute("aria-pressed","true");c.innerHTML=`<i style="background:${color[b]}"></i>${esc(b)}`;c.onclick=()=>{on.has(b)?on.delete(b):on.add(b);c.setAttribute("aria-pressed",on.has(b));applyFilter()};chips.appendChild(c)});
svg.addEventListener("click",reset);document.getElementById("reset").onclick=()=>{vb=[0,0,W,H];setVB();reset()};
document.getElementById("q").addEventListener("input",ev=>{const q=ev.target.value.toLowerCase();if(!q){reset();return}const m=D.nodes.find(n=>n.label.toLowerCase().includes(q));if(m)select(m.id)});
const tw=document.getElementById("tw");
document.getElementById("tbl").onclick=()=>{tw.classList.toggle("on");if(tw.classList.contains("on")&&!tw.innerHTML){tw.innerHTML=`<table><thead><tr><th>From</th><th>To</th><th>Amount</th><th>Date</th><th>Bloc</th><th>Hop</th><th>Status</th><th>Note</th></tr></thead><tbody>${D.rows.map(r=>`<tr><td>${esc(r.donor_or_entity)}</td><td>${esc(r.recipient_vehicle)}</td><td>${esc(r.amount)}</td><td>${esc(r.date_or_as_of)}</td><td>${esc(r.interest_bloc)}</td><td>${esc(r.hop)}</td><td>${esc(r.status)}</td><td>${esc(r.note)} ${r.source?`<a href="${esc(r.source)}" target="_blank" rel="noopener">source</a>`:""}</td></tr>`).join("")}</tbody></table>`}};
let vb=[0,0,W,H];function setVB(){svg.setAttribute("viewBox",vb.join(" "))}
svg.addEventListener("wheel",ev=>{ev.preventDefault();const k=ev.deltaY>0?1.12:.89;const r=svg.getBoundingClientRect();const px=vb[0]+(ev.clientX-r.left)/r.width*vb[2],py=vb[1]+(ev.clientY-r.top)/r.height*vb[3];vb=[px-(px-vb[0])*k,py-(py-vb[1])*k,vb[2]*k,vb[3]*k];setVB()},{passive:false});
let drag=null;svg.addEventListener("pointerdown",ev=>{drag=[ev.clientX,ev.clientY,vb[0],vb[1]]});window.addEventListener("pointerup",()=>drag=null);
window.addEventListener("pointermove",ev=>{if(!drag)return;const r=svg.getBoundingClientRect();vb[0]=drag[2]-(ev.clientX-drag[0])/r.width*vb[2];vb[1]=drag[3]-(ev.clientY-drag[1])/r.height*vb[3];setVB()});
reset();
</script>
</body>
</html>
