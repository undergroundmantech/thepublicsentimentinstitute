.main{display:grid;grid-template-columns:1fr 380px;min-height:0}
.canvas{position:relative;overflow:hidden;cursor:grab}
svg{width:100%;height:100%;display:block}

.node circle{stroke:var(--bg);stroke-width:2;cursor:pointer}
.node text{font:600 10px var(--font-body);fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.dim{opacity:.08}
.ringlab{font:600 10px var(--font-mono);fill:var(--faint);letter-spacing:.14em}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px}

.muted{color:var(--muted);font-size:.88rem}

.row a{color:var(--hub)}

function applyFilter(){D.nodes.forEach(n=>{if(n.ring>=2&&n.ring<4&&n.bloc)nodeEls[n.id].style.display=on.has(n.bloc)?"":"none"});edgeEls.forEach(({e,p})=>{const a=byId[e.s],b=byId[e.t];const hid=[a,b].some(x=>x&&x.ring>=2&&x.ring<4&&x.bloc&&!on.has(x.bloc));p.style.display=hid?"none":""});}

let vb=[0,0,W,H];function setVB(){svg.setAttribute("viewBox",vb.join(" "))}
